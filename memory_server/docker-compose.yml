# Memory service: `docker compose up -d --build` (tokens are read from .env, see .env.example).
services:
  memory:
    container_name: memory-server
    build:
      context: .
      args:
        MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-english}
    image: memory-server:latest
    environment:
      MEMORY_ADMIN_TOKEN: ${MEMORY_ADMIN_TOKEN:?set MEMORY_ADMIN_TOKEN in .env}
      MEMORY_AGENT_TOKENS: ${MEMORY_AGENT_TOKENS:?set MEMORY_AGENT_TOKENS in .env}
      MEMORY_VIEWER_TOKEN: ${MEMORY_VIEWER_TOKEN:-}
    ports:
      - "${MEMORY_PORT:-9501}:9501"
    volumes:
      - memory-data:/data
    restart: unless-stopped

volumes:
  memory-data:
